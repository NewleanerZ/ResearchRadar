name: researchradar

x-radar: &radar
  image: research-radar:local
  env_file:
    - path: .env
      required: false
  environment:
    RADAR_DATA_DIR: /data
  volumes:
    - radar-data:/data
  restart: unless-stopped

services:
  scheduler:
    <<: *radar
    build: .
  web:
    <<: *radar
    depends_on:
      - scheduler
    command:
      - python
      - -m
      - research_radar.cli
      - serve-api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"

  searxng:
    image: searxng/searxng:latest
    profiles: ["search"]
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    restart: unless-stopped

volumes:
  radar-data:
