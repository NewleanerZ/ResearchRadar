[project]
name = "research-radar"
version = "0.1.0"
description = "Persistent single-user academic literature radar"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14,<2",
    "apscheduler>=3.11,<4",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "filelock>=3.16,<4",
    "httpx>=0.28,<1",
    "langgraph>=1,<2",
    "mcp>=1.2,<2",
    "pydantic>=2.10,<3",
    "pypdf>=7.2,<8",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "scikit-learn>=1.5,<2",
    "sqlalchemy>=2,<3",
    "tzdata>=2024.2",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7,<7"]
embedding = ["sentence-transformers>=4,<6", "torch>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
